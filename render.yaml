services:
  - type: web
    name: tensor-pp09-practice
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:init && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
